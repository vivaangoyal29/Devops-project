# =============================================================================
# DevOps App Helm Chart - Default Values
# Override with environment-specific files (values-dev.yaml, values-prod.yaml)
# =============================================================================

# Replica count
replicaCount: 2

# Image configuration
image:
  repository: "devops-app"
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

# Application overrides
app:
  name: devops-app
  version: "1.0.0"
  environment: production
  logLevel: info
  port: 5000
  workers: 2

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  protocol: TCP

# Ingress configuration
ingress:
  enabled: false
  className: alb
  host: devops-app.example.com
  tls:
    enabled: false
    secretName: devops-app-tls-secret
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

# HorizontalPodAutoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# The Flask app is stateless; persistent storage is not required.
secrets:
  dbPassword: ""
  apiToken: ""

# Resources
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

# RBAC
rbac:
  enabled: true
  serviceAccountName: devops-app-sa

# Monitoring annotations
prometheus:
  scrape: true
  port: 5000
  path: /metrics

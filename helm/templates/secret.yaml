apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devops-app.fullname" . }}-secret
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
    app: devops-app
    component: secret
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  API_TOKEN: {{ .Values.secrets.apiToken | quote }}

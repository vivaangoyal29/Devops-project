apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/vivaangoyal29/Devops-project.git
    targetRevision: main
    path: helm
    helm:
      values: |
        replicaCount: 3
        image:
          repository: 645897840730.dkr.ecr.us-east-1.amazonaws.com/devops-app
          tag: "latest"
        ingress:
          enabled: false
        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 20
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - Validate=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 300s
        factor: 2

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'devops-app' }}
  IMAGE_TAG: ${{ github.sha }}
  CLUSTER_NAME: devops-cluster
  NAMESPACE: devops-prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest tests -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan application
        run: bandit -r application -ll -f json -o bandit-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r application/requirements.txt --format json --output pip-audit-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: security/.gitleaks.toml

  build-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set image repository
        id: image
        run: echo "repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ needs.build-push.outputs.image_repository }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          output: trivy-results.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.txt
          if-no-files-found: ignore
          retention-days: 7

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan, container-scan]
    if: always() && github.event_name == 'push'
    steps:
      - name: Require every scan to pass
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SCA_RESULT: ${{ needs.sca.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CONTAINER_SCAN_RESULT: ${{ needs.container-scan.result }}
        run: |
          printf 'SAST: %s\nSCA: %s\nSecrets: %s\nContainer: %s\n' \
            "$SAST_RESULT" "$SCA_RESULT" "$SECRET_SCAN_RESULT" "$CONTAINER_SCAN_RESULT"
          test "$SAST_RESULT" = success
          test "$SCA_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$CONTAINER_SCAN_RESULT" = success

  deploy:
    name: Deploy to EKS with Helm
    runs-on: ubuntu-latest
    needs: [build-push, container-scan, security-gate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - name: Install metrics-server for HPA metrics
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s
      - name: Deploy application
        env:
          IMAGE_REPOSITORY: ${{ needs.build-push.outputs.image_repository }}
        run: |
          helm upgrade --install devops-app ./helm \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values helm/values-prod.yaml \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set image.pullPolicy=IfNotPresent \
            --set ingress.enabled=false
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/devops-app -n "$NAMESPACE" --timeout=300s
          kubectl get pods,services,hpa -n "$NAMESPACE"
